[workspace]
name = "_trainer"
version = "0.1.0"
description = "YOLO & Geospatial Computer Vision Stack"
authors = ["brezemil"]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = [
    { platform = "win-64", cuda = "12.8" },
    { platform = "linux-64", cuda = "12.8" }
]

[dependencies]
# Core Runtime & Hardware (Tightened to protect FiftyOne)
python = ">=3.10,<3.13"

# Data, Geospatial & ML Foundation
pandas = ">=2.3.3,<4"
numpy = ">=1.26.4,<3"
scikit-learn = "*"
scikit-image = "*"
seaborn = "*"
matplotlib = ">=3.9.1,<4"
matplotlib-scalebar = ">=0.9.0,<0.10"
geopandas = ">=0.14.4,<2"
shapely = ">=2.0.1,<3"
contextily = ">=1.7.0,<2"

# MLOps & Experiment Tracking
wandb = ">=0.19.0"
codecarbon = ">=2.2.2,<3"
nvidia-ml-py = ">=13.595.45,<14"

# Interactive UI Components
ipywidgets = ">=8.1.8,<9"
anywidget = ">=0.10.0,<0.11"
plotly = ">=6.6.0,<7"

# --- AGY CLI & AI Development Core ---
pydantic = ">=2.0"
typer = ">=0.9.0"
rich = ">=13.0.0,<14.0.0"
ruff = ">=0.3.0"
pyright = ">=1.1.350"

# Lower-level Core Utilities
tqdm = "*"
python-dotenv = "*"
setuptools = "<70"
pycocotools = ">=2.0.11,<3"
pip = "*"

[pypi-dependencies]
# Vision Frameworks & Data Curation
fiftyone = { version = ">=1.14.1,<2", extras = ["desktop"] }
lightly-train = "*"
ultralytics = "*"
torch = { version = ">=2.6.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.21.0", index = "https://download.pytorch.org/whl/cu128" }
sahi = "*"                       # Sliced Aided Hyper Inference (Great for large aerial/satellite imagery)
albumentations = "*"             # Advanced augmentations
scipy = "*"
pillow = "*"

# App Utilities & Annotation SDKs
opencv-python = "*" 
label-studio-sdk = ">=0.0.13"
email-validator = ">=2.0.0"
folium = "*"

# --- AGY CLI & AI Development Core (PyPI) ---
instructor = ">=1.0.0"

[tasks]
wandb-login = "wandb login"
check-gpu = { cmd = "python -c \"import torch; print(f'PyTorch {torch.__version__} | CUDA Available: {torch.cuda.is_available()} | Device: {torch.cuda.get_device_name(0) if torch.cuda.is_available() else \\'None\\'}')\"", env = { PYTHONNOUSERSITE = "1" } }
check-yolo = "yolo checks"
train = { cmd = "python run_training.py", env = { PYTHONNOUSERSITE = "1" } }
train-baseline = { cmd = "python run_baseline_benchmark.py", env = { PYTHONNOUSERSITE = "1" } }
eval = { cmd = "python run_evaluation.py", env = { PYTHONNOUSERSITE = "1" } }
plot = { cmd = "python plot_results.py", env = { PYTHONNOUSERSITE = "1" } }
sweep = { cmd = "python run_sweep.py", env = { PYTHONNOUSERSITE = "1" } }
visualize = { cmd = "python visualize_fiftyone.py", env = { PYTHONNOUSERSITE = "1" } }
download-wandb = { cmd = "python download_wandb_logs.py", env = { PYTHONNOUSERSITE = "1" } }
analyze-benchmark = { cmd = "python run_benchmark_analysis.py", env = { PYTHONNOUSERSITE = "1" } }
analyze-alignment = { cmd = "python run_alignment_analysis.py", env = { PYTHONNOUSERSITE = "1" } }
distill = { cmd = "python run_distillation.py", env = { PYTHONNOUSERSITE = "1" } }
ide = "antigravity-ide"
cli = "agy"

# --- Agentic Workspace Verification & Formatting Tasks ---
lint = "ruff check . --fix"
format = "ruff format ."
check-types = "pyright ."
qa = { depends-on = ["lint", "format", "check-types"] }